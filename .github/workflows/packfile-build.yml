name: Build Packfile

on: 
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: |
          *
          !.git/**
          !.vscode/**
          !**/.*
          !**/*.rockspec
          !matchers/*
        description: |
          A list of glob patterns to include in the packfile.
      paths_separator:
        required: false
        type: string
        default: "\n"
        description: |
          Separator used to split the paths input.
      game:
        required: true
        type: string
        default: warhammer_3
        description: |
          Game used for packfile building.
          Can be one of the following:
            arena
            attila
            empire
            napoleon
            rome_2
            shogun_2
            three_kingdoms
            thrones_of_britannia
            troy
            warhammer
            warhammer_2
            warhammer_3
      debug_enabled:
        required: false
        type: boolean
        default: false
        description: Enable debug logging
    secrets:
      token:
        required: true

permissions:
  contents: read

env:
  DEBUG_ENABLED: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' || inputs.debug_enabled }}
  GH_TOKEN: ${{ secrets.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Checkout pinned RPFM 5.1.1 tooling
      uses: actions/checkout@v7.0.1
      with:
        repository: Warhammer-Mods/rpfm_cli-docker
        ref: 6bd3bdf2740ad95faa3c083c8c31e69dc1429a42
        path: .rpfm-action
    - uses: docker/setup-buildx-action@v4.4.1
    - name: Build cached RPFM Server 5.1.1 image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .rpfm-action/server
        load: true
        push: false
        tags: local/rpfm-server:5.1.1
        cache-from: type=gha,scope=rpfm-server-5.1.1
        cache-to: type=gha,mode=max,scope=rpfm-server-5.1.1
    - name: Start RPFM Server 5.1.1
      id: rpfm
      uses: Warhammer-Mods/rpfm_cli-docker/server@6bd3bdf2740ad95faa3c083c8c31e69dc1429a42
      with:
        image: local/rpfm-server:5.1.1
    - name: Build and verify packfile
      env:
        RPFM_URL: ${{ steps.rpfm.outputs.url }}
        PACK_PATHS: ${{ inputs.paths }}
        PACK_SEPARATOR: ${{ inputs.paths_separator }}
        PACK_GAME: ${{ inputs.game }}
        PACKFILE: ${{ github.event.repository.name }}.pack
      run: python3 .github/scripts/build_pack_server.py
    - name: Upload packfile
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ github.event.repository.name }}
        path: ${{ github.event.repository.name }}.pack
        retention-days: 90
        if-no-files-found: error
    - name: Collect server logs and stop container
      if: always() && steps.rpfm.outputs.container != ''
      env:
        RPFM_CONTAINER: ${{ steps.rpfm.outputs.container }}
      run: |
        docker logs "${RPFM_CONTAINER}" > rpfm-server.log 2>&1 || true
        docker rm --force "${RPFM_CONTAINER}" || true
    - name: Upload server log
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: rpfm-server log
        path: rpfm-server.log
        retention-days: 90
        if-no-files-found: ignore
