name: Lua lint

on:
  workflow_call:
    inputs:
      source_root:
        type: string
        required: false
        default: "."
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Lua checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
          luacheck --version
      - name: Check campaign scripts
        shell: bash
        env:
          CHECK_SOURCE_ROOT: ${{ inputs.source_root || '.' }}
        run: |
          # Luacheck returns 1 for warnings and 2 for syntax errors.
          # Preserve the existing workflow's warning policy.
          set +e
          luacheck "$CHECK_SOURCE_ROOT/script" --config .luacheckrc --formatter plain --codes --ranges
          result=$?
          if [ "$result" -eq 1 ]; then
            echo "::warning::Luacheck reported warnings; see the lint log."
            exit 0
          fi
          exit "$result"
