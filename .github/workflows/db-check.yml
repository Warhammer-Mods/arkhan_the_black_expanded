name: DB check

on:
  workflow_call:
    inputs:
      source_root:
        type: string
        required: false
        default: "."
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate database and localisation exports
        env:
          CHECK_SOURCE_ROOT: ${{ inputs.source_root || '.' }}
        run: |
          checker="$GITHUB_WORKSPACE/.github/scripts/check_tsv.py"
          cd "$CHECK_SOURCE_ROOT"
          python3 "$checker"
